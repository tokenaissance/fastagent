name: go-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sandbox-leases:
    name: sandbox + store + gateway tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Unit + adapter + Postgres concurrency tests
        env:
          FASTAGENT_TEST_PG_DSN: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        run: go test ./internal/sandbox/ ./internal/store/ ./internal/gateway/ -count=1

  sandbox-leases-e2b:
    name: Live E2B cross-pod adoption (credentials required)
    if: ${{ secrets.E2B_API_KEY != '' && secrets.E2B_TEMPLATE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run live E2B cross-pod adoption e2e
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_TEMPLATE: ${{ secrets.E2B_TEMPLATE }}
        run: go test ./internal/sandbox/ -run '^TestE2BPoolCrossPodAdoption$' -count=1 -v
