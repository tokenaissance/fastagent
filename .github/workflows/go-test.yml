name: go-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sandbox-leases:
    name: every package (unit + adapter + Postgres concurrency, -race)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # `internal/setup/embed.go` does `//go:embed all:web`, and `internal/setup/web` is created by
      # `make build-web` (gitignored; the image build produces the real one). A clean checkout therefore
      # cannot COMPILE `internal/setup` or `cmd/fastclaw` at all: `pattern all:web: no matching files
      # found` — found on 2026-09-23, the first time this job tested the whole tree instead of four
      # named packages. It also explains why the old list looked deliberate: it was the subset that
      # compiles without a web build.
      #
      # The stub is the cheap honest half. Those packages' tests drive their own HTTP handlers
      # (`NewServer(0)` + mux) and never read the SPA assets, so an empty embed directory is enough to
      # compile and run them; the REAL bundle is exercised by the image build (`docker.yml` runs
      # `make build-web`). If a test ever starts serving `/`, replace this stub with `make build-web` and
      # the failure will say so.
      - name: Stub the embedded web bundle (go:embed needs the directory to exist)
        run: |
          mkdir -p internal/setup/web
          printf 'placeholder — the real bundle is produced by `make build-web` (see docker.yml)\n' > internal/setup/web/PLACEHOLDER.txt
      - name: Unit + adapter + Postgres concurrency tests
        env:
          FASTAGENT_TEST_PG_DSN: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        # The WHOLE tree, not a package list. Until 2026-09-23 this job named four
        # packages (sandbox, store, gateway, and agent/tools in the job below) while the
        # repository had 392 test files across ~33 packages — so most unit tests existed,
        # passed locally under `make test`, and never ran here. `make test` IS `go test ./...`;
        # this job is that command plus `-race` and a Postgres service, which is the shape a
        # CI gate should have: the same thing the developer ran, run where they cannot skip it.
        #
        # `-race` is load-bearing, not decoration: the sandbox pool runs a sweeper on a
        # background goroutine and parallel tool calls share one executor, so the interesting
        # bugs are races. Measured 2026-09-23 on this tree: 1m39s with -race across all
        # packages, and the first run found one real defect — a security test whose
        # "plaintext token found in DB" assertion searched 2-letter substrings inside random
        # ciphertext, i.e. it failed ~1 run in a few hundred with the property intact
        # (fixed in internal/mcp/oauth/adapter/db_test.go).
        #
        # The live e2b tests (TestE2BPool…, TestSandboxBackgroundE2BLive,
        # TestE2BLiveBrowserColdStart) are owned by the credentials job below;
        # they FAIL — by design, so a green run can't be mistaken for verified —
        # when the secrets are absent, and this job has no secrets. Skipping them
        # by name keeps that rule intact for the job that owns them instead of
        # weakening it here.
        run: >
          go test ./...
          -skip '^TestE2BPoolCrossPodAdoption$|^TestE2BPoolCrossPodRebuild$|^TestSandboxBackgroundE2BLive$|^TestE2BLiveBrowserColdStart$'
          -count=1 -race

  sandbox-leases-e2b:
    name: Live E2B cross-pod adoption (credentials required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # The credential gate is a STEP condition, not a job condition. `secrets` is
      # not an available context in `jobs.<id>.if`, and an expression that names an
      # unavailable context fails the whole run at evaluation time — which is what
      # happened here: every push since this workflow was added (2026-09-07)
      # produced a run with ZERO jobs, so no job ever ran. `secrets` IS available
      # in a step's `env`, which is where the values are injected below.
      - name: Run live E2B cross-pod adoption e2e
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_TEMPLATE: ${{ secrets.E2B_TEMPLATE }}
        # TestSandboxBackgroundE2BLive is the canary for the one claim the
        # offline tests cannot make: that a detached job survives the exec
        # request on the real hosted backend. If envd ever starts reaping
        # detached sessions, this is where it shows up first.
        # TestE2BLiveBrowserColdStart is the other one: the sandbox image no
        # longer has a pre-warmed browser daemon waiting, so a fresh scope's
        # first browser call is what proves the shim in the image carries it.
        run: |
          if [ -z "$E2B_API_KEY" ] || [ -z "$E2B_TEMPLATE" ]; then
            # Green, but not silent. This job is a no-op without the two secrets, and a no-op
            # that looks like a pass is the thing this workflow spent a comment learning to
            # avoid — so it says so in the run's annotations, where a reader sees it without
            # opening the log.
            echo "::notice title=live e2e did not run::no E2B_API_KEY / E2B_TEMPLATE secrets in this repository. The real-backend tests are unverified on this run."
            exit 0
          fi
          go test ./internal/sandbox/ ./internal/agent/tools/ \
            -run '^TestE2BPoolCrossPodAdoption$|^TestSandboxBackgroundE2BLive$|^TestE2BLiveBrowserColdStart$' \
            -count=1 -v

  sandbox-background:
    name: sandbox background exec (unit + real-shell + docker)
    runs-on: ubuntu-latest
    steps:
      # NOTE (2026-09-23): this job is now a SUBSET of the whole-tree job above — it predates it,
      # when CI only ran four named packages. It is kept because its `-v` output is what the
      # JobOutlivesTheToolCall failures are read from, and dropping it would trade a minute of CI for a
      # worse debugging view. If someone wants the minute back, delete this job: the coverage is
      # already in `go test ./... -race`.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # The offline tests run the composed launcher/probe/kill against a real
      # /bin/sh; the docker e2e runs the same flow through a real container, so
      # "the job outlives the tool call" is checked against a kernel rather
      # than against a string. -race because the job table is shared by
      # concurrent tool calls and the sweeper/exec paths already race-tested
      # elsewhere: a mutex bug here would only show up as a lost cursor.
      - name: Background exec tests (docker runner provides docker)
        # Same split as above: the live e2b background test belongs to the job that
        # holds the credentials.
        run: >
          go test ./internal/agent/tools/ -run 'Sandbox|Background'
          -skip '^TestSandboxBackgroundE2BLive$'
          -count=1 -race -v

  prompt-inventory:
    name: prompt snapshot matches the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The prompt corpus (docs/prompt-inventory/) is generated from the Go
      # sources. Editing a prompt without regenerating it is the same debt as
      # documenting a test that does not exist, so it fails the build instead of
      # waiting for a reader to notice. Provenance line numbers are ignored by
      # the check; prompt TEXT is not.
      - name: Prompt inventory is up to date
        run: python3 scripts/extract-prompt-inventory.py --check

  vulncheck:
    name: govulncheck (reachable vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # Why this exists: Dependabot's 164 alerts did not include the one finding
      # that was actually reachable — klauspost/compress/s2's out-of-bounds read
      # (GO-2026-5841, fixed in v1.18.7) — because it only tracks advisories it
      # has a GHSA for, on packages it can see declared. govulncheck walks the
      # call graph instead, and it is the reason the module now sits at v1.20.0.
      #
      # It gates on REACHABLE findings only, which is the bar that matters: the
      # three it still lists for x/crypto are ssh/agent-forwarding advisories in
      # a module this tree uses for bcrypt, and it does not fail on them.
      #
      # Pinned to v1.7.0 rather than @latest: v1.8.0 requires Go 1.26 and this
      # workflow (and the Dockerfile) pin 1.25. Bumping this pin is part of the
      # toolchain move, not a drive-by.
      #
      # One thing this job cannot see: it reports against the toolchain's own
      # standard library, so a stale local Go shows findings that CI does not
      # (1.25.0 has 31; 1.25.14 has none). If this job goes red, check which
      # version it blamed before assuming the dependencies are at fault.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  toolchain-pin:
    name: the Go version line is a decision, not a side effect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Why this exists: on 2026-09-16 Dependabot's go-minor-patch group opened a
      # pull request that was eight routine module bumps plus one quiet line —
      # `go 1.25.0` became `go 1.26.0`, because golang.org/x/crypto v0.57.0
      # requires it. Every test in the repo still passed. What failed was
      # govulncheck, on 21 reachable standard-library findings in go1.26.0 that
      # are fixed in go1.26.1 — a red check that reads like a dependency problem
      # and is really a toolchain problem.
      #
      # This repository is private, so branch protection is not available
      # ("Upgrade to GitHub Pro"): a red check is a signal, not a gate. And the
      # version line is pinned in three places that have to agree — go.mod, the
      # Dockerfile's builder image, and this workflow — so drifting one of them
      # is the mistake worth a job.
      #
      # It asserts they agree rather than hard-coding a version: moving to Go
      # 1.26 stays possible, it just has to be said out loud in all three.
      - name: go.mod matches the image's Go version
        run: |
          want=$(grep -oE 'FROM golang:[0-9]+\.[0-9]+' Dockerfile | head -1 | sed 's/.*golang://')
          have=$(awk '$1 == "go" { print $2; exit }' go.mod)
          have_mm=${have%.*}
          if [ "$have_mm" != "$want" ]; then
            echo "go.mod says 'go $have' but the Dockerfile builds on Go $want." >&2
            echo "Moving the Go version line is a decision: change go.mod, the Dockerfile" >&2
            echo "and the go-version pins in this workflow together, and say why in the commit." >&2
            exit 1
          fi
          echo "go.mod ($have) and the builder image (Go $want) agree."
