name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web UI
        run: make build-web

      - name: Build binaries
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Two readers of the version: the CLI's main package and the admin UI's
          # buildinfo package. The Makefile stamps both, so this step stamps both
          # as well; a release that only stamped main would show "dev" in the UI.
          ldflags="-s -w \
            -X main.version=${version} -X main.commit=${commit} -X main.date=${built} \
            -X github.com/fastclaw-ai/fastclaw/internal/buildinfo.Version=${version} \
            -X github.com/fastclaw-ai/fastclaw/internal/buildinfo.Commit=${commit} \
            -X github.com/fastclaw-ai/fastclaw/internal/buildinfo.Date=${built}"
          mkdir -p dist
          for pair in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/arm64 windows/amd64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            out="dist/fastagent_${os}_${arch}/fastagent"
            [ "$os" = windows ] && out="${out}.exe"

            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -ldflags "$ldflags" -o "$out" ./cmd/fastclaw
          done

          # The stamped values are the one claim a release must not get wrong, so
          # read them back from a binary the runner can execute natively.
          dist/fastagent_linux_amd64/fastagent version

      - name: Package artifacts
        run: |
          cd dist
          for d in fastagent_darwin_* fastagent_linux_*; do
            tar -czf "${d}.tar.gz" -C "$d" fastagent
          done
          for d in fastagent_windows_*; do
            (cd "$d" && zip -q "../${d}.zip" fastagent.exe)
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
