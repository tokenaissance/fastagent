# Optional — in-cluster self-hosted Postgres, suitable for dev / single-node trials.
# For production, prefer a managed service (Aliyun RDS / AWS RDS / etc.) and
# point fastagent.yaml's fastagent-secrets.STORAGE_DSN at it; this file is not needed.
#
# To use alongside fastagent.yaml:
#   1. kubectl apply -f postgres.yml          (creates the resources below)
#   2. In fastagent.yaml, set fastagent-secrets.STORAGE_DSN to:
#        postgres://fastagent:<POSTGRES_PASSWORD above>@fastagent-db:5432/fastagent?sslmode=disable
#   3. kubectl apply -f fastagent.yaml
apiVersion: v1
kind: Secret
metadata:
  name: fastagent-db
  namespace: fastagent
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-in-production"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fastagent-db
  namespace: fastagent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastagent-db
  namespace: fastagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastagent-db
  template:
    metadata:
      labels:
        app: fastagent-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: fastagent
        - name: POSTGRES_USER
          value: fastagent
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fastagent-db
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "fastagent"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: fastagent-db
---
apiVersion: v1
kind: Service
metadata:
  name: fastagent-db
  namespace: fastagent
spec:
  selector:
    app: fastagent-db
  ports:
  - port: 5432
