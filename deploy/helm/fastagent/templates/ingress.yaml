{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fastagent.fullname" . }}
  labels:
    {{- include "fastagent.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | quote }}
    # SSE / WS are long-lived — the default 60s timeout disconnects clients constantly.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # One session, one pod — the ingress key is the session id every chat call
    # already carries in its query string (`?sessionId=…`), so a subscriber and
    # the turn it is watching share an in-process hub. Read only by the origin
    # pod, never persisted: that half of the delivery gap is what this covers,
    # and the store tail covers the rest (docs/chat-event-delivery-placement.md).
    #
    # Not cookie affinity: a cookie is per-browser, so two browsers watching one
    # session would land on two pods — exactly the case this exists for. It was
    # also inert here, because the cloud proxy rebuilds the request headers on
    # the way in and the SSE response headers on the way out.
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_sessionId"
    {{- with .Values.ingress.certManagerIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tlsSecret | default (printf "%s-tls" (include "fastagent.fullname" .)) }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "fastagent.fullname" . }}-gateway
            port:
              number: {{ .Values.gateway.port }}
{{- end }}
