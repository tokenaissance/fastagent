# Agent commit checks: the skill an agent runs over work about to be committed
# or pushed.
#
# Two readers:
#   .codex/hooks/pre_tool_use.py  - inside a Codex session, before `git commit`
#   .githooks/pre-push            - before the commits leave the machine
#
# Shipped dormant. Empty `skill` keeps both triggers silent; the pre-push half
# additionally needs `enabled=1` here or FASTAGENT_COMMIT_CHECK=1 in the
# environment. See docs/agent-commit-checks.md.

# Turn the pre-push half on for every clone. Leave empty to keep it opt-in
# per push (FASTAGENT_COMMIT_CHECK=1 git push).
enabled=

# The skill(s) the agent must run, spelled as they appear in its skill list.
# Comma-separated for more than one; they are applied in the order written.
skill=clean-architecture

# Optional extra criteria, appended to the skill's own. Keep it to one line:
# this is a focus hint, not a second spec.
focus=
